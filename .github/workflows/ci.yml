# このworkflowは push / PR のたびに lint とテストを自動実行します。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # Actionsタブから手動実行もできるようにする

# 最小権限: このworkflowはリポジトリを読むだけ
permissions:
  contents: read

# 同じブランチで新しいpushが来たら、古い実行はキャンセルする
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install ruff
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    needs: lint # lintが通ったらテストへ
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: Smoke test CLI
        run: logscope samples/asa.log --max-severity 4
